syntax = "proto3";

package rov.telemetry;

// A standard 3-axis representation for IMU data
message Vector3D {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Telemetry from the ROV sensors to the topside
message SensorData {
  uint64 timestamp_us = 1;
  Vector3D acceleration = 2;      // m/s^2
  Vector3D angular_velocity = 3;   // rad/s
  float depth = 4;                 // meters (calculated from pressure)
  float temperature = 5;           // Celsius
}

// Control commands from topside (joystick) to the ROV
message JoystickCommand {
  uint64 timestamp_us = 1;
  float forward = 2;   // -1.0 to 1.0 (surge)
  float strafe = 3;    // -1.0 to 1.0 (sway)
  float vertical = 4;  // -1.0 to 1.0 (heave)
  float pitch = 5;     // -1.0 to 1.0
  float roll = 6;      // -1.0 to 1.0
  float yaw = 7;       // -1.0 to 1.0 (heading)
}

// Stereo depth analysis from the OAK-D W Pro (Core CV) to topside.
// The OAK-D computes the depth map onboard; the Pi analyzes a central ROI and
// publishes only this small summary over ZMQ (never the raw depth frame).
message StereoDepth {
  uint64 timestamp_us = 1;
  uint32 width = 2;               // depth frame width (px)
  uint32 height = 3;              // depth frame height (px)
  float center_distance_m = 4;    // median depth in the central ROI
  float min_distance_m = 5;       // nearest valid depth in the ROI (closest obstacle)
  float max_distance_m = 6;       // farthest valid depth in the ROI
  float coverage = 7;             // fraction of valid (non-zero) depth pixels in ROI [0..1]
  // 3D position of the ROI target in the camera frame (meters):
  // +x right, +y up, +z forward. z equals center_distance_m.
  float x_m = 8;
  float y_m = 9;
  float z_m = 10;
}

// testing message
message test {
  string msg = 1;
}
