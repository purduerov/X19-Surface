<!-- frontend/src/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}X19-Surface{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    {% block styles %}{% endblock %}
</head>
<body {% block body_attributes %}{% endblock %}>
    <nav id="top-nav" class="relative z-50 border-b border-rov-border bg-rov-panel text-white shadow-lg">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-2 px-4 py-2">
            <a class="mr-3 text-lg font-bold tracking-wide text-rov-accent" href="/">X19-Surface</a>

            <a class="rounded px-3 py-2 text-sm font-medium hover:bg-rov-item {% if active_page == 'home' %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}"
               href="/home">
                <i class="bi bi-house"></i> Home
            </a>

            <details class="group relative">
                <summary class="cursor-pointer list-none rounded px-3 py-2 text-sm font-medium hover:bg-rov-item {% if active_page in ['fullscreen-camera', 'all-cameras'] %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}">
                    <i class="bi bi-camera-video"></i> Cameras <span class="ml-1 inline-block group-open:rotate-180">⌄</span>
                </summary>
                <div class="absolute left-0 top-full mt-1 w-52 overflow-hidden rounded-lg border border-rov-border bg-rov-panel p-1 shadow-xl">
                    <a class="block rounded px-3 py-2 text-sm hover:bg-rov-item {% if active_page == 'fullscreen-camera' %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}"
                       href="/fullscreen-camera">Single Camera View</a>
                    <a class="block rounded px-3 py-2 text-sm hover:bg-rov-item {% if active_page == 'all-cameras' %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}"
                       href="/all-cameras">All Cameras</a>
                </div>
            </details>

            <details class="group relative">
                <summary class="cursor-pointer list-none rounded px-3 py-2 text-sm font-medium hover:bg-rov-item {% if active_page in ['thruster-testing', 'controller-mapping', 'controller-config', 'controller-buttons'] %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}">
                    <i class="bi bi-joystick"></i> Controls <span class="ml-1 inline-block group-open:rotate-180">⌄</span>
                </summary>
                <div class="absolute left-0 top-full mt-1 w-56 overflow-hidden rounded-lg border border-rov-border bg-rov-panel p-1 shadow-xl">
                    <a class="block rounded px-3 py-2 text-sm hover:bg-rov-item {% if active_page == 'thruster-testing' %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}"
                       href="/thruster-testing"><i class="bi bi-gear-fill"></i> Thruster Testing</a>
                    <a class="block rounded px-3 py-2 text-sm hover:bg-rov-item {% if active_page == 'controller-mapping' %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}"
                       href="/controller-mapping"><i class="bi bi-controller"></i> Controller Mapping</a>
                    <a class="block rounded px-3 py-2 text-sm hover:bg-rov-item {% if active_page == 'controller-config' %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}"
                       href="/controller-config"><i class="bi bi-sliders"></i> Controller Config</a>
                    <a class="block rounded px-3 py-2 text-sm hover:bg-rov-item {% if active_page == 'controller-buttons' %}bg-rov-btn text-white{% else %}text-slate-300{% endif %}"
                       href="/controller-buttons"><i class="bi bi-dpad"></i> Controller Buttons</a>
                </div>
            </details>
        </div>
    </nav>

    {% block content %}{% endblock %}

    {% block scripts %}
    <script src="/static/socket-io-v4.8.1.js"></script>
    <script src="/static/socketio_listener.js"></script>
    {% endblock %}

    <script>
        // Shift+H hides / shows the top nav bar (works on every page)
        document.addEventListener("keydown", function (event) {
            const typing = event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA";
            if (event.shiftKey && event.key.toLowerCase() === "h" && !typing) {
                const nav = document.getElementById("top-nav");
                nav.hidden = !nav.hidden;
            }
        });
    </script>
</body>
</html>
