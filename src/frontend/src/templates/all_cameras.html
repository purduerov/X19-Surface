{% extends "base.html" %}

{% block title %}All Cameras{% endblock %}

{% block body_attributes %}class="bg-rov-dark font-orbitron text-white min-h-screen"{% endblock %}

{% block content %}
<div class="camera-grid-container">
  <div class="camera-grid">
    
    <!-- Camera 1 -->
    <div class="camera-cell">
      <div class="camera-label">Camera 1</div>
      <iframe class="w-full h-full border-none" src="{{ camera_urls.camera1|safe }}" scrolling="no"></iframe>
      
      <button class="photo-button" data-camera="camera1">
        📸
      </button>

      <button class="fullscreen-button" data-camera="1">
        <i class="bi bi-fullscreen"></i>
      </button>
    </div>
    
    <!-- Camera 2 -->
    <div class="camera-cell">
      <div class="camera-label">Camera 2</div>
      <iframe class="w-full h-full border-none" src="{{ camera_urls.camera2|safe }}" scrolling="no"></iframe>

      <button class="photo-button" data-camera="camera2">
        📸
      </button>

      <button class="fullscreen-button" data-camera="2">
        <i class="bi bi-fullscreen"></i>
      </button>
    </div>
    
    <!-- Camera 3 -->
    <div class="camera-cell">
      <div class="camera-label">Camera 3</div>
      <iframe class="w-full h-full border-none" src="{{ camera_urls.camera3|safe }}" scrolling="no"></iframe>

      <button class="photo-button" data-camera="camera3">
        📸
      </button>

      <button class="fullscreen-button" data-camera="3">
        <i class="bi bi-fullscreen"></i>
      </button>
    </div>
    
    <!-- Camera 4 -->
    <div class="camera-cell">
      <div class="camera-label">Camera 4</div>
      <iframe class="w-full h-full border-none" src="{{ camera_urls.camera4|safe }}" scrolling="no"></iframe>

      <button class="photo-button" data-camera="camera4">
        📸
      </button>

      <button class="fullscreen-button" data-camera="4">
        <i class="bi bi-fullscreen"></i>
      </button>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Setup fullscreen button actions
  const fullscreenButtons = document.querySelectorAll('.fullscreen-button');
  
  fullscreenButtons.forEach(button => {
    button.addEventListener('click', function() {
      const cameraNumber = this.getAttribute('data-camera');
      // Redirect to single camera view with the selected camera
      window.location.href = `/fullscreen-camera?camera=${cameraNumber}`;
    });
  });

  // photo button
  document.querySelectorAll('.photo-button').forEach(button => {
    button.addEventListener('click', async function (e) {
      e.stopPropagation(); // Prevent accidental fullscreen click

      const camera = this.getAttribute('data-camera');
      this.disabled = true;
      this.textContent = "⏳";

      try {
        const res = await fetch(`/api/photo/${camera}`, {
          method: "POST"
        });

        const data = await res.json();

        if (data.status === "ok") {
          this.textContent = "✅";
          setTimeout(() => this.textContent = "📸", 1000);
        } else {
          throw new Error("Photo failed");
        }
      } catch (err) {
        console.error(err);
        this.textContent = "❌";
        setTimeout(() => this.textContent = "📸", 1500);
      } finally {
        this.disabled = false;
      }
    });
  });
});
</script>
{% endblock %}
